# Example only — create the real Secret out of band, never commit a webhook URL:
#   kubectl -n monitoring create secret generic alertmanager-slack \
#     --from-literal=webhook='https://hooks.slack.com/services/XXX/YYY/ZZZ'
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-slack
  namespace: monitoring
type: Opaque
stringData:
  webhook: https://hooks.slack.com/services/REPLACE/ME/PLEASE
