# =============================================================================
# kube-prometheus-stack values — VANTA Boutique
# - Alertmanager routes by severity to Slack (webhook read from Secret `alertmanager-slack`)
# - SRE alert rules: pod/node/deployment health + SLO burn-rate on ingress-nginx metrics
# - Grafana admin password comes from Secret `grafana-admin` (never from this file)
# - Components pinned to the control-plane node (workers are t3.micro)
# See monitoring/README.md for the secrets to create before `helm upgrade --install`.
# =============================================================================

# --- Prometheus Server ---
prometheus:
  prometheusSpec:
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""
    tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    retention: 6h
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

# --- Grafana ---
grafana:
  service:
    type: NodePort
    nodePort: 32000
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  # kubectl -n monitoring create secret generic grafana-admin \
  #   --from-literal=admin-user=admin --from-literal=admin-password='<strong-password>'
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  defaultDashboardsEnabled: true
  defaultDashboardsTimezone: "Asia/Kolkata"
  sidecar:
    dashboards:
      enabled: true          # picks up ConfigMaps labelled grafana_dashboard=1 (monitoring/grafana/)
      searchNamespace: ALL

# --- Alertmanager: severity-based routing to Slack ---
# kubectl -n monitoring create secret generic alertmanager-slack \
#   --from-literal=webhook='https://hooks.slack.com/services/XXX/YYY/ZZZ'
alertmanager:
  enabled: true
  alertmanagerSpec:
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""
    tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 50m
        memory: 64Mi
    secrets:
      - alertmanager-slack     # mounted at /etc/alertmanager/secrets/alertmanager-slack/
  config:
    global:
      resolve_timeout: 5m
      slack_api_url_file: /etc/alertmanager/secrets/alertmanager-slack/webhook
    route:
      receiver: slack-warning
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: "null"
          matchers: ["alertname = Watchdog"]
        - receiver: slack-critical
          matchers: ["severity = critical"]
          repeat_interval: 1h
        - receiver: slack-warning
          matchers: ["severity = warning"]
    inhibit_rules:
      # a firing critical for the same alert/namespace silences its warning twin
      - source_matchers: ["severity = critical"]
        target_matchers: ["severity = warning"]
        equal: ["alertname", "namespace"]
    receivers:
      - name: "null"
      - name: slack-critical
        slack_configs:
          - channel: "#vanta-alerts-critical"
            send_resolved: true
            title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.namespace }})'
            text: '{{ range .Alerts }}• {{ .Annotations.summary }}{{ "\n" }}{{ end }}'
      - name: slack-warning
        slack_configs:
          - channel: "#vanta-alerts"
            send_resolved: true
            title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.namespace }})'
            text: '{{ range .Alerts }}• {{ .Annotations.summary }}{{ "\n" }}{{ end }}'

# --- SRE Alert Rules ---
additionalPrometheusRulesMap:
  vanta-sre-alerts:
    groups:
      # SLO: 99.5% availability of the storefront measured at the nginx Ingress.
      # Multi-window burn-rate (Google SRE workbook): fast 1h/5m, slow 6h/30m.
      - name: boutique.slo.availability
        rules:
          - record: slo:ingress_error_ratio:rate5m
            expr: |
              sum(rate(nginx_ingress_controller_requests{status=~"5.."}[5m]))
              / clamp_min(sum(rate(nginx_ingress_controller_requests[5m])), 1)
          - record: slo:ingress_error_ratio:rate1h
            expr: |
              sum(rate(nginx_ingress_controller_requests{status=~"5.."}[1h]))
              / clamp_min(sum(rate(nginx_ingress_controller_requests[1h])), 1)
          - record: slo:ingress_error_ratio:rate30m
            expr: |
              sum(rate(nginx_ingress_controller_requests{status=~"5.."}[30m]))
              / clamp_min(sum(rate(nginx_ingress_controller_requests[30m])), 1)
          - record: slo:ingress_error_ratio:rate6h
            expr: |
              sum(rate(nginx_ingress_controller_requests{status=~"5.."}[6h]))
              / clamp_min(sum(rate(nginx_ingress_controller_requests[6h])), 1)
          - alert: SLOErrorBudgetBurnFast
            # 14.4x burn over 1h AND 5m → budget gone in ~2 days; page.
            expr: slo:ingress_error_ratio:rate1h > (14.4 * 0.005) and slo:ingress_error_ratio:rate5m > (14.4 * 0.005)
            for: 2m
            labels: { severity: critical, team: sre, slo: availability }
            annotations:
              summary: "Storefront availability SLO burning FAST (1h error ratio {{ $value | humanizePercentage }})"
              runbook: docs/RUNBOOKS.md#ingress-5xx--slo-burn
          - alert: SLOErrorBudgetBurnSlow
            # 6x burn over 6h AND 30m → budget gone in ~5 days; ticket.
            expr: slo:ingress_error_ratio:rate6h > (6 * 0.005) and slo:ingress_error_ratio:rate30m > (6 * 0.005)
            for: 15m
            labels: { severity: warning, team: sre, slo: availability }
            annotations:
              summary: "Storefront availability SLO burning slowly (6h error ratio {{ $value | humanizePercentage }})"
              runbook: docs/RUNBOOKS.md#ingress-5xx--slo-burn
      - name: boutique.reviews
        rules:
          - alert: ReviewsDatabaseDown
            expr: kube_deployment_status_ready_replicas{namespace=~"boutique.*", deployment="reviews-db"} == 0
            for: 2m
            labels: { severity: critical, team: sre }
            annotations:
              summary: "reviews-db has no ready replica in {{ $labels.namespace }} — reviews will fail health checks"
              runbook: docs/RUNBOOKS.md#reviews-db-down
      - name: boutique.pod.health
        rules:
          - alert: PodCrashLooping
            expr: rate(kube_pod_container_status_restarts_total{namespace="boutique"}[5m]) > 0
            for: 5m
            labels:
              severity: warning
              team: sre
            annotations:
              summary: "Pod {{ $labels.pod }} is crash-looping"
              description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has restarted in the last 5 minutes."
          - alert: PodNotReady
            expr: kube_pod_status_ready{namespace="boutique", condition="true"} == 0
            for: 3m
            labels:
              severity: critical
              team: sre
            annotations:
              summary: "Pod {{ $labels.pod }} is not ready"
      - name: boutique.node.health
        rules:
          - alert: NodeNotReady
            expr: kube_node_status_condition{condition="Ready", status="true"} == 0
            for: 2m
            labels:
              severity: critical
              team: sre
            annotations:
              summary: "Node {{ $labels.node }} is NotReady"
          - alert: NodeHighMemoryUsage
            expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
            for: 5m
            labels:
              severity: warning
              team: sre
            annotations:
              summary: "Node {{ $labels.instance }} memory above 90%"
          - alert: NodeHighCPUUsage
            expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
            for: 5m
            labels:
              severity: warning
              team: sre
            annotations:
              summary: "Node {{ $labels.instance }} CPU above 85%"
          - alert: NodeDiskPressure
            expr: (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 > 85
            for: 5m
            labels:
              severity: warning
              team: sre
            annotations:
              summary: "Node {{ $labels.instance }} disk above 85%"
      - name: boutique.deployment.health
        rules:
          - alert: DeploymentReplicasMismatch
            expr: kube_deployment_spec_replicas{namespace="boutique"} != kube_deployment_status_ready_replicas{namespace="boutique"}
            for: 5m
            labels:
              severity: critical
              team: sre
            annotations:
              summary: "Deployment {{ $labels.deployment }} has replica mismatch"
          - alert: HpaMaxedOut
            expr: kube_horizontalpodautoscaler_status_current_replicas{namespace="boutique"} == kube_horizontalpodautoscaler_spec_max_replicas{namespace="boutique"}
            for: 10m
            labels:
              severity: warning
              team: sre
            annotations:
              summary: "HPA {{ $labels.horizontalpodautoscaler }} is at max replicas"

# --- kube-state-metrics ---
kube-state-metrics:
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# --- Prometheus Node Exporter ---
prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 50m
      memory: 32Mi

# --- Prometheus Operator ---
prometheusOperator:
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  admissionWebhooks:
    enabled: false
    patch:
      enabled: false

# --- Disable components we don't need ---
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
