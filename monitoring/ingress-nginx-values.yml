# ingress-nginx Helm values for the kubeadm/EC2 cluster: NodePort entry + Prometheus metrics.
# The SLO burn-rate alerts in prometheus-values.yml are computed from these metrics.
controller:
  replicaCount: 1
  service:
    type: NodePort
    nodePorts:
      http: 30080
      https: 30443
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true          # picked up by kube-prometheus-stack (selectorNilUsesHelmValues=false)
  resources:
    requests: { cpu: 50m, memory: 90Mi }
    limits: { cpu: 300m, memory: 256Mi }
  config:
    enable-real-ip: "true"
    use-forwarded-headers: "true"
