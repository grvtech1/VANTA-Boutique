apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventoryservice
  labels:
    app: inventoryservice
spec:
  # Read-only, seeded at startup, so every replica serves identical answers:
  # safe to scale horizontally (staging/prod run 2+ with a PDB).
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: inventoryservice
  template:
    metadata:
      labels:
        app: inventoryservice
    spec:
      serviceAccountName: inventoryservice
      terminationGracePeriodSeconds: 25
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: server
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
        # Built and pushed by the CD pipeline; overlays pin an immutable :<git-sha>.
        image: docker.io/grvp1/inventoryservice:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 50053
        env:
        - name: PORT
          value: "50053"
        - name: LOW_STOCK_THRESHOLD
          value: "5"
        # To ship real quantities without a rebuild, mount a ConfigMap and set:
        # - name: INVENTORY_SEED_FILE
        #   value: /etc/inventory/seed.json
        readinessProbe:
          periodSeconds: 5
          timeoutSeconds: 5
          grpc:
            port: 50053
        livenessProbe:
          timeoutSeconds: 5
          grpc:
            port: 50053
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: inventoryservice
  labels:
    app: inventoryservice
spec:
  type: ClusterIP
  selector:
    app: inventoryservice
  ports:
  - name: grpc
    port: 50053
    targetPort: 50053
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: inventoryservice
