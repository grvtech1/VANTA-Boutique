apiVersion: apps/v1
kind: Deployment
metadata:
  name: wishlistservice
  labels:
    app: wishlistservice
spec:
  # IMPORTANT: single replica, no HPA, no PDB. The store is in-process; a second
  # pod would hold a different wishlist for the same session. Scale out only
  # after moving to a shared store (see src/wishlistservice/store.go — the
  # Store interface seam).
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: wishlistservice
  template:
    metadata:
      labels:
        app: wishlistservice
    spec:
      serviceAccountName: wishlistservice
      terminationGracePeriodSeconds: 25
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: server
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
        # Built and pushed by the CD pipeline; overlays pin an immutable :<git-sha>.
        image: docker.io/grvp1/wishlistservice:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 50052
        env:
        - name: PORT
          value: "50052"
        readinessProbe:
          periodSeconds: 5
          timeoutSeconds: 5
          grpc:
            port: 50052
        livenessProbe:
          timeoutSeconds: 5
          grpc:
            port: 50052
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: wishlistservice
  labels:
    app: wishlistservice
spec:
  type: ClusterIP
  selector:
    app: wishlistservice
  ports:
  - name: grpc
    port: 50052
    targetPort: 50052
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wishlistservice
