# prod overlay — MANUAL ArgoCD sync. Tags are immutable git SHAs promoted with
# `scripts/promote.sh <sha>` (which edits this file and opens the change for review).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: boutique
resources:
  - namespace.yaml
  - ../../base
  - hpa.yaml
  - hpa-reviews.yaml

components:
  - ../../components/network-policies       # default-deny + per-service allow lists
  - ../../components/pod-disruption-budgets # survive node drains
  - ../../components/reviews-persistence    # durable Postgres reviews store
  - ../../components/ingress                # nginx Ingress (rate-limited)
  - ../../components/tls                    # cert-manager TLS on the Ingress

# `latest` here means "never promoted yet": the first `scripts/promote.sh --from-staging`
# replaces all twelve tags with one git SHA, and every later release is a Git commit.
images:
  - name: docker.io/grvp1/adservice
    newTag: latest
  - name: docker.io/grvp1/cartservice
    newTag: latest
  - name: docker.io/grvp1/checkoutservice
    newTag: latest
  - name: docker.io/grvp1/currencyservice
    newTag: latest
  - name: docker.io/grvp1/emailservice
    newTag: latest
  - name: docker.io/grvp1/frontend
    newTag: latest
  - name: docker.io/grvp1/loadgenerator
    newTag: latest
  - name: docker.io/grvp1/paymentservice
    newTag: latest
  - name: docker.io/grvp1/productcatalogservice
    newTag: latest
  - name: docker.io/grvp1/recommendationservice
    newTag: latest
  - name: docker.io/grvp1/reviewsservice
    newTag: latest
  - name: docker.io/grvp1/shippingservice
    newTag: latest

replicas:
  - name: adservice
    count: 3
  - name: cartservice
    count: 3
  - name: checkoutservice
    count: 3
  - name: currencyservice
    count: 3
  - name: emailservice
    count: 3
  - name: frontend
    count: 3
  - name: loadgenerator
    count: 1
  - name: paymentservice
    count: 3
  - name: productcatalogservice
    count: 3
  - name: recommendationservice
    count: 3
  - name: reviewsservice
    count: 2
  - name: shippingservice
    count: 3

patches:
  # Public hostname for the Ingress — change to your domain (DNS A record → NLB / node IP).
  - target:
      kind: Ingress
      name: boutique-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: vanta.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: vanta.example.com
  # frontend-external stays ClusterIP-less in prod: traffic enters only through the Ingress
  - target:
      kind: Service
      name: frontend-external
    patch: |-
      - op: replace
        path: /spec/type
        value: ClusterIP
