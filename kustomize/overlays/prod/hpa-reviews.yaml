# Only valid together with components/reviews-persistence (shared MySQL store);
# with the in-memory store each replica would hold different data.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: reviewsservice-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: reviewsservice
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
