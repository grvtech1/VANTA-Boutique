# dev overlay — local kind / single-node. Floating `latest` tags are acceptable HERE ONLY
# (fast inner loop). staging/prod are pinned to immutable git SHAs by the CD pipeline.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: boutique
resources:
  - namespace.yaml
  - ../../base

# Every service image is built by this repo's CI and lives under docker.io/grvp1 — there is
# no runtime dependency on an upstream registry. dev floats on `latest` (local builds).
images:
  - name: docker.io/grvp1/adservice
    newTag: latest
  - name: docker.io/grvp1/cartservice
    newTag: latest
  - name: docker.io/grvp1/checkoutservice
    newTag: latest
  - name: docker.io/grvp1/currencyservice
    newTag: latest
  - name: docker.io/grvp1/emailservice
    newTag: latest
  - name: docker.io/grvp1/frontend
    newTag: latest
  - name: docker.io/grvp1/loadgenerator
    newTag: latest
  - name: docker.io/grvp1/paymentservice
    newTag: latest
  - name: docker.io/grvp1/productcatalogservice
    newTag: latest
  - name: docker.io/grvp1/recommendationservice
    newTag: latest
  - name: docker.io/grvp1/reviewsservice
    newTag: latest
  - name: docker.io/grvp1/shippingservice
    newTag: latest

replicas:
  - name: adservice
    count: 1
  - name: cartservice
    count: 1
  - name: checkoutservice
    count: 1
  - name: currencyservice
    count: 1
  - name: emailservice
    count: 1
  - name: frontend
    count: 1
  - name: loadgenerator
    count: 1
  - name: paymentservice
    count: 1
  - name: productcatalogservice
    count: 1
  - name: recommendationservice
    count: 1
  - name: reviewsservice
    count: 1
  - name: shippingservice
    count: 1

patches:
  # Expose the storefront on NodePort 30080 (kind-local.yaml maps it to http://localhost:8888)
  - target:
      kind: Service
      name: frontend-external
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: replace
        path: /spec/ports/0/nodePort
        value: 30080
