apiVersion: v1
kind: Namespace
metadata:
  name: boutique
  labels:
    app.kubernetes.io/part-of: vanta-boutique
    environment: eks
    # Pod Security Admission: the strictest built-in profile. Every workload
    # here runs non-root, drops all capabilities and uses the RuntimeDefault
    # seccomp profile (patched in kustomization.yaml), so restricted is
    # enforced, not just warned about. A pod that tries privileged, hostPath,
    # root or extra capabilities is rejected at admission.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    # AWS Load Balancer Controller injects a readiness gate into pods behind
    # an ALB: a new pod only counts as Ready once the ALB target is healthy,
    # so a rollout never removes old pods before new ones take traffic.
    elbv2.k8s.aws/pod-readiness-gate-inject: enabled
