# =============================================================================
# Reviews MySQL credentials from SSM Parameter Store (External Secrets Operator)
# =============================================================================
# The base component ships a demo Secret with the passwords in plain text. On
# EKS that Secret is deleted (see the patch in kustomization.yaml) and ESO
# builds the same Secret, same name and keys, from SSM SecureString parameters.
# The MySQL Deployment and reviewsservice read it unchanged.
#
# Git holds only these pointers. The values live in SSM:
#   /vanta/reviews/mysql-password
#   /vanta/reviews/mysql-root-password
#
# The ClusterSecretStore has no auth block on purpose: ESO then uses its own
# pod credentials, which come from the IRSA role in terraform-eks (irsa_eso),
# scoped to read-only on /vanta/*.
# =============================================================================
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-parameter-store
spec:
  provider:
    aws:
      service: ParameterStore
      region: ap-south-1
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: reviews-mysql
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: reviews-mysql
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        MYSQL_DATABASE: reviews
        MYSQL_USER: reviews
        MYSQL_PASSWORD: "{{ .password }}"
        MYSQL_ROOT_PASSWORD: "{{ .rootPassword }}"
        database-url: "reviews:{{ .password }}@tcp(reviews-mysql:3306)/reviews?charset=utf8mb4&tls=false"
  data:
    - secretKey: password
      remoteRef:
        key: /vanta/reviews/mysql-password
    - secretKey: rootPassword
      remoteRef:
        key: /vanta/reviews/mysql-root-password
