# =============================================================================
# EKS Overlay — kustomize/overlays/eks
# =============================================================================
# TARGET: AWS EKS managed cluster (see terraform-eks/ for the cluster itself).
# DIFFERS from overlays/staging in three key ways:
#   1. Namespace "boutique" (not "boutique-staging") — EKS is a separate cluster
#      so the plain name is unambiguous.
#   2. No frontend-external NodePort patch — ALB fronts the cluster instead.
#      The frontend Service stays ClusterIP; ALB routes directly to pod IPs.
#   3. Adds gp3-storageclass.yaml and ingress.yaml — EKS-specific resources
#      that don't belong in the shared base or components.
#
# COMPONENTS reused from the kubeadm/staging setup (no duplication):
#   reviews-persistence  — MySQL-backed reviewsservice (PVC uses this overlay's
#                          default StorageClass = gp3, which is EBS CSI-backed)
#   pod-disruption-budgets — same PDBs keep HA during node group rolling updates
#
# Image tags: pinned to the SAME git SHA as overlays/staging.
#   SHA: 80cd5b81a72d63b140e813ca351c030284935002
#   The CD pipeline (scripts/bump-image-tags.sh) MUST be updated to also commit
#   into this overlay when promoting. Until then, manually bump tags on promote.
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: boutique
resources:
  - namespace.yaml
  - gp3-storageclass.yaml    # EKS needs EBS CSI StorageClass as default (see file for WHY)
  - ingress.yaml              # ALB Ingress (replaces nginx NodePort from kubeadm setup)
  - external-secrets.yaml     # reviews MySQL creds from SSM via External Secrets Operator
  - ../../base

# The reviews-persistence component ships a demo Secret with plain-text
# passwords. On EKS it is removed here and rebuilt by ESO from SSM
# (external-secrets.yaml), so no credential lives in Git for this cluster.
patches:
  # Pod Security "restricted" needs a seccomp profile on every pod; the
  # upstream manifests already run non-root with all capabilities dropped,
  # this was the only gap. RuntimeDefault = the container runtime's default
  # syscall filter.
  - target:
      kind: Deployment
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: all
      spec:
        template:
          spec:
            securityContext:
              seccompProfile:
                type: RuntimeDefault
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: reviews-mysql

components:
  - ../../components/reviews-persistence      # MySQL-backed reviews; PVC binds to gp3 on EKS
  - ../../components/pod-disruption-budgets   # ensures HA during EKS managed node group updates

