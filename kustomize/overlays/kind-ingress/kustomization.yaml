# dev overlay + nginx Ingress, for local kind. Requires the ingress-nginx controller:
#   scripts/install-ingress-nginx.sh --provider kind
# then: kubectl apply -k kustomize/overlays/kind-ingress  →  http://vanta.local (add to /etc/hosts)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../dev
components:
  - ../../components/ingress
