# staging overlay — auto-synced by ArgoCD. Image tags below are IMMUTABLE git SHAs written by
# the CD pipeline (scripts/bump-image-tags.sh) for all twelve services. `latest` appears only
# until the first CD run after a service starts being built here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: boutique-staging
resources:
  - namespace.yaml
  - ../../base

components:
  - ../../components/pod-disruption-budgets
  - ../../components/reviews-persistence   # durable Postgres store → reviewsservice can run 2 replicas

images:
  - name: docker.io/grvp1/adservice
    newTag: latest
  - name: docker.io/grvp1/cartservice
    newTag: latest
  - name: docker.io/grvp1/checkoutservice
    newTag: latest
  - name: docker.io/grvp1/currencyservice
    newTag: latest
  - name: docker.io/grvp1/emailservice
    newTag: latest
  - name: docker.io/grvp1/frontend
    newTag: 4ff50002a8ba3f1dad895f49bff48e707893cba8
  - name: docker.io/grvp1/loadgenerator
    newTag: latest
  - name: docker.io/grvp1/paymentservice
    newTag: latest
  - name: docker.io/grvp1/productcatalogservice
    newTag: 4ff50002a8ba3f1dad895f49bff48e707893cba8
  - name: docker.io/grvp1/recommendationservice
    newTag: latest
  - name: docker.io/grvp1/reviewsservice
    newTag: 4ff50002a8ba3f1dad895f49bff48e707893cba8
  - name: docker.io/grvp1/shippingservice
    newTag: latest

replicas:
  - name: adservice
    count: 2
  - name: cartservice
    count: 2
  - name: checkoutservice
    count: 2
  - name: currencyservice
    count: 2
  - name: emailservice
    count: 2
  - name: frontend
    count: 2
  - name: loadgenerator
    count: 1
  - name: paymentservice
    count: 2
  - name: productcatalogservice
    count: 2
  - name: recommendationservice
    count: 2
  - name: reviewsservice
    count: 2
  - name: shippingservice
    count: 2

patches:
  - target:
      kind: Service
      name: frontend-external
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: replace
        path: /spec/ports/0/nodePort
        value: 30081
