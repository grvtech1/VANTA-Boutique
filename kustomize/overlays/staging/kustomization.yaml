# staging overlay — auto-synced by ArgoCD. Image tags below are IMMUTABLE git SHAs written by
# the CD pipeline (scripts/bump-image-tags.sh). `latest` appears only until the first CD run.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: boutique-staging
resources:
  - namespace.yaml
  - ../../base

components:
  - ../../components/pod-disruption-budgets
  - ../../components/reviews-persistence   # durable Postgres store → reviewsservice can run 2 replicas

images:
  - name: us-central1-docker.pkg.dev/google-samples/microservices-demo/frontend
    newName: docker.io/grvp1/frontend
    newTag: 4ff50002a8ba3f1dad895f49bff48e707893cba8
  - name: us-central1-docker.pkg.dev/google-samples/microservices-demo/productcatalogservice
    newName: docker.io/grvp1/productcatalogservice
    newTag: 4ff50002a8ba3f1dad895f49bff48e707893cba8
  - name: docker.io/grvp1/reviewsservice
    newName: docker.io/grvp1/reviewsservice
    newTag: 4ff50002a8ba3f1dad895f49bff48e707893cba8

replicas:
  - name: adservice
    count: 2
  - name: cartservice
    count: 2
  - name: checkoutservice
    count: 2
  - name: currencyservice
    count: 2
  - name: emailservice
    count: 2
  - name: frontend
    count: 2
  - name: loadgenerator
    count: 1
  - name: paymentservice
    count: 2
  - name: productcatalogservice
    count: 2
  - name: recommendationservice
    count: 2
  - name: reviewsservice
    count: 2
  - name: shippingservice
    count: 2

patches:
  - target:
      kind: Service
      name: frontend-external
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: replace
        path: /spec/ports/0/nodePort
        value: 30081
