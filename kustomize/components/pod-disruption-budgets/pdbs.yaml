# =============================================================================
# PodDisruptionBudgets — Protect services during voluntary disruptions
# =============================================================================
# WHY: Without PDBs, draining a node for maintenance can evict ALL replicas
#      of a service simultaneously, causing a full outage.
# =============================================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: frontend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cartservice-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: cartservice
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: checkoutservice-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: checkoutservice
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: currencyservice-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: currencyservice
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: paymentservice-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: paymentservice
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-cart-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: redis-cart
---
# reviewsservice runs >=2 replicas wherever reviews-persistence is enabled (staging/prod).
# NOTE: never put a minAvailable:1 PDB on a single-replica Deployment — it blocks node drains.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: reviewsservice-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: reviewsservice
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: productcatalogservice-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: productcatalogservice
