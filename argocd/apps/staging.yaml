# staging: AUTO-SYNC. The CD pipeline promotes every green main build here by committing
# the image SHA into kustomize/overlays/staging (see .github/workflows/cd-pipeline.yml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vanta-boutique-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/grvtech1/VANTA-Boutique.git
    targetRevision: main
    path: kustomize/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: boutique-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
