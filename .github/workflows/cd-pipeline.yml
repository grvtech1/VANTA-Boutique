# =============================================================================
# CD — pull-based GitOps promotion to STAGING
# Trigger: CI succeeded on main. Flow: build → push :<git-sha> → commit the SHA into
# kustomize/overlays/staging → ArgoCD (in-cluster) notices the Git change and syncs.
# CI holds NO cluster credentials and never calls the ArgoCD API. Prod is promoted by
# scripts/promote.sh + a manual ArgoCD sync.
# =============================================================================
name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline - Build and Test"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: cd-main
  cancel-in-progress: false

env:
  SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  build-and-push:
    name: "Push ${{ matrix.service.name }}:<sha>"
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    strategy:
      # All fourteen services: the staging/prod overlays reference docker.io/grvp1/<svc> only.
      matrix:
        service:
          - { name: adservice,             context: src/adservice }
          - { name: cartservice,           context: src/cartservice/src }
          - { name: checkoutservice,       context: src/checkoutservice }
          - { name: currencyservice,       context: src/currencyservice }
          - { name: emailservice,          context: src/emailservice }
          - { name: frontend,              context: src/frontend }
          - { name: inventoryservice,      context: src/inventoryservice }
          - { name: loadgenerator,         context: src/loadgenerator }
          - { name: paymentservice,        context: src/paymentservice }
          - { name: productcatalogservice, context: src/productcatalogservice }
          - { name: recommendationservice, context: src/recommendationservice }
          - { name: reviewsservice,        context: src/reviewsservice }
          - { name: shippingservice,       context: src/shippingservice }
          - { name: wishlistservice,       context: src/wishlistservice }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      # Immutable tag only. No `:latest` — a moving tag makes "what is running?" unanswerable.
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service.context }}
          push: true
          tags: docker.io/${{ secrets.DOCKER_USERNAME }}/${{ matrix.service.name }}:${{ env.SHA }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

  promote-staging:
    name: "GitOps: pin staging to <sha>"
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Bump image tags in kustomize/overlays/staging
        run: scripts/bump-image-tags.sh kustomize/overlays/staging/kustomization.yaml "$SHA"
      - name: Commit + push (skip ci to avoid a loop)
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then echo "staging already at $SHA"; exit 0; fi
          git add kustomize/overlays/staging/kustomization.yaml
          git commit -m "ci(gitops): promote ${SHA::7} to staging [skip ci]" \
                     -m "Image tags pinned by CD from CI run ${{ github.event.workflow_run.id }}."
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main
          done
          echo "push failed after retries" >&2; exit 1

  notify:
    needs: promote-staging
    if: ${{ always() && needs.promote-staging.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ needs.promote-staging.result }}" = "success" ]; then
            echo "CD OK — ${SHA::7} pushed and pinned in staging; ArgoCD will sync it."
          else
            echo "CD FAILED for ${SHA::7} — check build-and-push / promote-staging logs."
          fi
          echo "Promote to prod: scripts/promote.sh $SHA && git push  →  argocd app sync vanta-boutique-prod"
