name: kustomize-build-ci
on:
  push:
    branches: [main]
    paths: ["kustomize/**", ".github/workflows/kustomize-build-ci.yaml"]
  pull_request:
    paths: ["kustomize/**", ".github/workflows/kustomize-build-ci.yaml"]
permissions:
  contents: read
jobs:
  kustomize-build-ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: render every overlay and test combination
        run: |
          set -euo pipefail
          for d in kustomize kustomize/overlays/* kustomize/tests/*/; do
            echo "== $d"; kubectl kustomize "$d" > /dev/null
          done
