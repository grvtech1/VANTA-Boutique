# Manual dependency bump — the fix path when the CI Trivy gate blocks on a fixable CVE.
# Run from the Actions tab (or `gh workflow run deps-bump.yml`), optionally naming modules.
# It commits go.mod/go.sum to main and then dispatches CI itself: pushes made with GITHUB_TOKEN
# never trigger `push` workflows, but workflow_dispatch is exempt — so the gate re-runs.
name: deps-bump

on:
  workflow_dispatch:
    inputs:
      modules:
        description: "module@min-version entries (space-separated); module@latest to force newest"
        required: false
        default: "golang.org/x/crypto@v0.55.0 google.golang.org/grpc@v1.79.3"

permissions:
  contents: write
  actions: write

concurrency:
  group: deps-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/frontend/go.mod
      - name: Bump + tidy + build/vet
        env:
          MODULES: ${{ inputs.modules }}
        run: scripts/bump-go-deps.sh
      - name: Commit + push
        id: push
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- 'src/*/go.mod' 'src/*/go.sum'; then
            echo "nothing to bump"; echo "pushed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git add 'src/*/go.mod' 'src/*/go.sum'
          git commit -m "fix(deps): bump ${{ inputs.modules }} (Trivy CRITICAL gate)" \
                     -m "Automated by the deps-bump workflow; CI is dispatched on this commit to re-run the scan gate."
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Dispatch CI on the new commit
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci-pipeline.yml --ref main
