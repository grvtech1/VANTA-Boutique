# =============================================================================
# CI — test → build → scan (gate) → SBOM → validate manifests
# Runs on every push to main / feature / hotfix branches and on PRs to main.
# The CD pipeline (cd-pipeline.yml) only runs after this workflow succeeds on main.
# =============================================================================
name: "CI Pipeline - Build and Test"

on:
  workflow_dispatch: {}   # manual re-run; deps-bump uses it because GITHUB_TOKEN pushes never trigger push workflows
  push:
    branches: [main, "feature/**", "hotfix/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: "Lint (go vet)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/productcatalogservice/go.mod
      - run: cd src/productcatalogservice && go vet .

  test:
    name: "Unit tests — productcatalogservice"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/productcatalogservice/go.mod
      - run: cd src/productcatalogservice && go test -v -coverprofile=coverage.out .
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-productcatalogservice
          path: src/productcatalogservice/coverage.out

  test-reviewsservice:
    name: "Reviews service — vet + race tests (Postgres)"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: reviews
          POSTGRES_USER: reviews
          POSTGRES_PASSWORD: reviews
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reviews"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/reviewsservice/go.mod
      - env:
          TEST_DATABASE_URL: postgres://reviews:reviews@localhost:5432/reviews?sslmode=disable
        run: |
          cd src/reviewsservice
          go vet ./...
          go test -race -v -coverprofile=coverage.out ./...

  build-scan:
    name: "Build + Trivy gate + SBOM — ${{ matrix.service.name }}"
    runs-on: ubuntu-latest
    needs: [test, test-reviewsservice]
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: frontend,              context: src/frontend }
          - { name: productcatalogservice, context: src/productcatalogservice }
          - { name: reviewsservice,        context: src/reviewsservice }
    env:
      IMAGE: vanta-${{ matrix.service.name }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (local image, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # GATE: any fixable CRITICAL vulnerability fails the build — scan what ships.
      - name: Trivy — CRITICAL (blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: Trivy — HIGH (report only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}
          severity: HIGH
          ignore-unfixed: true
          exit-code: "0"
          format: table

      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.service.name }}.cdx.json
          artifact-name: sbom-${{ matrix.service.name }}
          upload-artifact: true

  validate-manifests:
    name: "Validate Kustomize + Helm"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: kubectl kustomize (root, overlays, tests)
        run: |
          set -euo pipefail
          for d in kustomize kustomize/overlays/* kustomize/tests/*/; do
            echo "== $d"; kubectl kustomize "$d" > /dev/null
          done
      - name: helm lint + template
        run: |
          set -euo pipefail
          helm lint helm-chart
          helm template vanta helm-chart > /dev/null
          helm template vanta helm-chart \
            --set networkPolicies.create=true \
            --set reviewsService.database.enabled=true \
            --set telemetry.collectorAddr=otel-collector:4317 \
            --set telemetry.tracing=true > /dev/null
