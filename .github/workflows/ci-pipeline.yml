# =============================================================================
# CI — test → build → scan (gate) → SBOM → validate manifests
# Runs on every push to main / feature / hotfix branches and on PRs to main.
# The CD pipeline (cd-pipeline.yml) only runs after this workflow succeeds on main.
# =============================================================================
name: "CI Pipeline - Build and Test"

on:
  workflow_dispatch: {}   # manual re-run; deps-bump uses it because GITHUB_TOKEN pushes never trigger push workflows
  push:
    branches: [main, "feature/**", "hotfix/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-vet-test:
    name: "Go — vet + unit tests — ${{ matrix.service }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [checkoutservice, frontend, inventoryservice, productcatalogservice, shippingservice, wishlistservice]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # go.mod says `go 1.25.0` + `toolchain go1.26.1`; setup-go only honours the `go` line
          # and the 1.25 tool + 1.26 toolchain mix breaks -coverprofile ("version does not
          # match go tool version"). Pin the same major as the Dockerfile builder (golang:1.26).
          go-version: "1.26"
      # -copylocks=false: upstream money/ passes pb.Money by value; protobuf now embeds a
      # mutex in MessageState, which trips the copylocks check without being a real bug.
      - run: |
          cd src/${{ matrix.service }}
          go vet -copylocks=false ./...
          go test -v -coverprofile=coverage.out ./...
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: src/${{ matrix.service }}/coverage.out

  test-reviewsservice:
    name: "Reviews service — vet + race tests (MySQL)"
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: reviews
          MYSQL_USER: reviews
          MYSQL_PASSWORD: reviews
          MYSQL_ROOT_PASSWORD: reviews-root-test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "MYSQL_PWD=reviews mysql -h 127.0.0.1 -ureviews reviews -e 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"   # same toolchain as the Dockerfile builder
      - env:
          TEST_DATABASE_URL: "reviews:reviews@tcp(127.0.0.1:3306)/reviews?charset=utf8mb4&tls=false"
          REQUIRE_MYSQL_TESTS: "1"
        run: |
          cd src/reviewsservice
          go vet ./...
          go test -race -v -coverprofile=coverage.out ./...

  build-scan:
    name: "Build + Trivy gate + SBOM — ${{ matrix.service.name }}"
    runs-on: ubuntu-latest
    needs: [go-vet-test, test-reviewsservice]
    strategy:
      fail-fast: false
      # Every service that ships is built and scanned here — no image comes from a registry
      # this repo does not control.
      matrix:
        service:
          - { name: adservice,             context: src/adservice }
          - { name: cartservice,           context: src/cartservice/src }
          - { name: checkoutservice,       context: src/checkoutservice }
          - { name: currencyservice,       context: src/currencyservice }
          - { name: emailservice,          context: src/emailservice }
          - { name: frontend,              context: src/frontend }
          - { name: inventoryservice,      context: src/inventoryservice }
          - { name: loadgenerator,         context: src/loadgenerator }
          - { name: paymentservice,        context: src/paymentservice }
          - { name: productcatalogservice, context: src/productcatalogservice }
          - { name: recommendationservice, context: src/recommendationservice }
          - { name: reviewsservice,        context: src/reviewsservice }
          - { name: shippingservice,       context: src/shippingservice }
          - { name: wishlistservice,       context: src/wishlistservice }
    env:
      IMAGE: vanta-${{ matrix.service.name }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (local image, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          # one cache scope per service, otherwise the fourteen jobs evict each other's layers
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

      # GATE: any fixable CRITICAL vulnerability fails the build — scan what ships.
      - name: Trivy — CRITICAL (blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: Trivy — HIGH (report only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}
          severity: HIGH
          ignore-unfixed: true
          exit-code: "0"
          format: table

      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.service.name }}.cdx.json
          artifact-name: sbom-${{ matrix.service.name }}
          upload-artifact: true

  validate-manifests:
    name: "Validate Kustomize + Helm"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: kubectl kustomize (root, overlays, tests)
        run: |
          set -euo pipefail
          for d in kustomize kustomize/overlays/* kustomize/tests/*/; do
            echo "== $d"; kubectl kustomize "$d" > /dev/null
          done
      - name: helm lint + template
        run: |
          set -euo pipefail
          helm lint helm-chart
          helm template vanta helm-chart > /dev/null
          helm template vanta helm-chart \
            --set networkPolicies.create=true \
            --set reviewsService.database.enabled=true \
            --set telemetry.collectorAddr=otel-collector:4317 \
            --set telemetry.tracing=true > /dev/null
