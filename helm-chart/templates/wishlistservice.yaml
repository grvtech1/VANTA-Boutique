# wishlistservice — VANTA addition (Go/gRPC). Mirrors kustomize/base/wishlistservice.yaml.
{{- if .Values.wishlistService.create }}
{{- if .Values.serviceAccounts.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.wishlistService.name }}
  namespace: {{ .Release.Namespace }}
  {{- if not .Values.serviceAccounts.annotationsOnlyForCartservice }}
  {{- with .Values.serviceAccounts.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.wishlistService.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.wishlistService.name }}
spec:
  {{- if gt (int .Values.wishlistService.replicas) 1 }}
  {{- fail "wishlistService.replicas > 1 is not supported: the store is in-memory and per-pod" }}
  {{- end }}
  replicas: {{ .Values.wishlistService.replicas }}
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: {{ .Values.wishlistService.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.wishlistService.name }}
    spec:
      {{- if .Values.serviceAccounts.create }}
      serviceAccountName: {{ .Values.wishlistService.name }}
      {{- else }}
      serviceAccountName: default
      {{- end }}
      terminationGracePeriodSeconds: 25
      {{- if .Values.securityContext.enable }}
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        {{- if .Values.seccompProfile.enable }}
        seccompProfile:
          type: {{ .Values.seccompProfile.type }}
        {{- end }}
      {{- end }}
      containers:
      - name: server
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
        image: {{ include "vanta.image" (list . "wishlistservice" .Values.wishlistService.name) }}
        ports:
        - containerPort: 50052
        env:
        - name: PORT
          value: "50052"
        - name: MAX_ITEMS_PER_USER
          value: {{ .Values.wishlistService.maxItemsPerUser | quote }}
        readinessProbe:
          periodSeconds: 5
          timeoutSeconds: 5
          grpc:
            port: 50052
        livenessProbe:
          timeoutSeconds: 5
          grpc:
            port: 50052
        resources:
          {{- toYaml .Values.wishlistService.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.wishlistService.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.wishlistService.name }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.wishlistService.name }}
  ports:
  - name: grpc
    port: 50052
    targetPort: 50052
{{- if .Values.networkPolicies.create }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.wishlistService.name }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Values.wishlistService.name }}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: {{ .Values.frontend.name }}
    ports:
     - port: 50052
       protocol: TCP
  egress: []
{{- end }}
{{- end }}
