# reviewsservice — VANTA addition (Go/gRPC). Mirrors kustomize/base/reviewsservice.yaml.
{{- if .Values.reviewsService.create }}
{{- if .Values.serviceAccounts.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.reviewsService.name }}
  namespace: {{ .Release.Namespace }}
  {{- if not .Values.serviceAccounts.annotationsOnlyForCartservice }}
  {{- with .Values.serviceAccounts.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.reviewsService.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.reviewsService.name }}
spec:
  {{- if and (gt (int .Values.reviewsService.replicas) 1) (not .Values.reviewsService.database.enabled) }}
  {{- fail "reviewsService.replicas > 1 requires reviewsService.database.enabled=true (the in-memory store is per-pod)" }}
  {{- end }}
  replicas: {{ .Values.reviewsService.replicas }}
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: {{ .Values.reviewsService.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.reviewsService.name }}
    spec:
      {{- if .Values.serviceAccounts.create }}
      serviceAccountName: {{ .Values.reviewsService.name }}
      {{- else }}
      serviceAccountName: default
      {{- end }}
      terminationGracePeriodSeconds: 25
      {{- if .Values.securityContext.enable }}
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        {{- if .Values.seccompProfile.enable }}
        seccompProfile:
          type: {{ .Values.seccompProfile.type }}
        {{- end }}
      {{- end }}
      containers:
      - name: server
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
        image: {{ include "vanta.image" (list . "reviewsservice" .Values.reviewsService.name) }}
        ports:
        - containerPort: 50051
        env:
        - name: PORT
          value: "50051"
        {{- if .Values.reviewsService.database.enabled }}
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ .Values.reviewsService.database.existingSecret }}
              key: {{ .Values.reviewsService.database.key }}
        {{- end }}
        {{- if .Values.telemetry.collectorAddr }}
        - name: COLLECTOR_SERVICE_ADDR
          value: {{ .Values.telemetry.collectorAddr | quote }}
        - name: OTEL_SERVICE_NAME
          value: {{ .Values.reviewsService.name | quote }}
        {{- end }}
        readinessProbe:
          periodSeconds: 5
          timeoutSeconds: 5
          grpc:
            port: 50051
        livenessProbe:
          timeoutSeconds: 5
          grpc:
            port: 50051
        resources:
          {{- toYaml .Values.reviewsService.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.reviewsService.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.reviewsService.name }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.reviewsService.name }}
  ports:
  - name: grpc
    port: 50051
    targetPort: 50051
{{- if .Values.networkPolicies.create }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.reviewsService.name }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Values.reviewsService.name }}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: {{ .Values.frontend.name }}
    ports:
     - port: 50051
       protocol: TCP
  egress:
  - {}
{{- end }}
{{- end }}
