# Default values for vanta-boutique.
# Derived from the upstream Online Boutique chart (Apache-2.0); cloud-provider options removed.

images:
  # All twelve services are built by this repo's CI and pushed here tagged with the git SHA.
  # Set `tag` to that SHA in real environments (staging/prod); `latest` is for local loops only.
  repository: docker.io/grvp1
  tag: latest
  # Optional per-service override, e.g. to canary one service from a different build:
  #   overrides: { frontend: { repository: docker.io/grvp1/frontend, tag: <git-sha> } }
  overrides: {}

serviceAccounts:
  create: true
  annotations: {}
  annotationsOnlyForCartservice: false

networkPolicies:
  # One NetworkPolicy per service + deny-all (see templates/common.yaml).
  create: false

sidecars:
  create: false

authorizationPolicies:
  create: false

# Cloud-neutral telemetry. Point collectorAddr at any OTLP/gRPC collector (e.g. the
# kustomize `tracing` component's otel-collector) to enable tracing.
telemetry:
  tracing: false
  metrics: false
  collectorAddr: ""

seccompProfile:
  enable: false
  type: RuntimeDefault

securityContext:
  enable: true

adService:
  create: true
  name: adservice
  resources:
    requests: { cpu: 200m, memory: 180Mi }
    limits: { cpu: 300m, memory: 300Mi }

cartService:
  create: true
  name: cartservice
  resources:
    requests: { cpu: 200m, memory: 128Mi }
    limits: { cpu: 300m, memory: 256Mi }

checkoutService:
  create: true
  name: checkoutservice
  resources:
    requests: { cpu: 100m, memory: 64Mi }
    limits: { cpu: 200m, memory: 128Mi }

currencyService:
  create: true
  name: currencyservice
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 200m, memory: 256Mi }

emailService:
  create: true
  name: emailservice
  resources:
    requests: { cpu: 100m, memory: 64Mi }
    limits: { cpu: 200m, memory: 128Mi }

frontend:
  create: true
  name: frontend
  externalService: true
  # One of: local, aws, azure, onprem, alibaba — only affects the UI banner.
  platform: local
  singleSharedSession: false
  virtualService:
    create: false
    hosts:
      - "*"
    gateway:
      name: asm-ingressgateway
      namespace: asm-ingress
      labelKey: asm
      labelValue: ingressgateway
  resources:
    requests: { cpu: 100m, memory: 64Mi }
    limits: { cpu: 200m, memory: 128Mi }

loadGenerator:
  create: true
  name: loadgenerator
  checkFrontendInitContainer: true
  resources:
    requests: { cpu: 300m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

paymentService:
  create: true
  name: paymentservice
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 200m, memory: 256Mi }

productCatalogService:
  create: true
  name: productcatalogservice
  extraLatency: ""
  resources:
    requests: { cpu: 100m, memory: 64Mi }
    limits: { cpu: 200m, memory: 128Mi }

recommendationService:
  create: true
  name: recommendationservice
  resources:
    requests: { cpu: 100m, memory: 220Mi }
    limits: { cpu: 200m, memory: 450Mi }

# New in VANTA: product reviews over gRPC (see src/reviewsservice).
reviewsService:
  create: true
  name: reviewsservice
  # Keep 1 with the in-memory store; >1 only when database.enabled (shared Postgres).
  replicas: 1
  database:
    enabled: false
    # Secret holding the connection string, e.g. created by the kustomize reviews-persistence
    # component: key `database-url` in Secret `reviews-db`.
    existingSecret: reviews-db
    key: database-url
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }

shippingService:
  create: true
  name: shippingservice
  resources:
    requests: { cpu: 100m, memory: 64Mi }
    limits: { cpu: 200m, memory: 128Mi }

cartDatabase:
  # Redis only (the upstream Spanner/AlloyDB stores were removed from cartservice).
  type: redis
  connectionString: "redis-cart:6379"
  inClusterRedis:
    create: true
    name: redis-cart
    # Docker Hub library image, digest-pinned (Redis is the one image this repo does not build).
    image: redis:alpine@sha256:c5e375abb885e6b2021c0377879e4890bf76f9065b8922ffc113f2b226b9fc17
  externalRedisTlsOrigination:
    enable: false
    name: exernal-redis-tls-origination
    endpointAddress: ""
    endpointPort: ""
    certificate: ""
