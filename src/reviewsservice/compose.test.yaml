# Isolated tests: no published ports or access to a Kubernetes cluster.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: reviews
      MYSQL_USER: reviews
      MYSQL_PASSWORD: reviews-test
      MYSQL_ROOT_PASSWORD: reviews-root-test
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u"$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1"']
      interval: 3s
      timeout: 3s
      retries: 60
    volumes:
      - mysql-test-data:/var/lib/mysql
  tests:
    image: golang:1.26.2
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
      - go-modules:/go/pkg/mod
      - go-build:/root/.cache/go-build
    environment:
      TEST_DATABASE_URL: "reviews:reviews-test@tcp(mysql:3306)/reviews?charset=utf8mb4&tls=false"
      REQUIRE_MYSQL_TESTS: "1"
    depends_on:
      mysql:
        condition: service_healthy
    command: [sh, -c, 'go vet ./... && go test -mod=readonly -race -count=1 -v ./...']
volumes:
  mysql-test-data:
  go-modules:
  go-build:
